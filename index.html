<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YFS Stickball — Sepulveda Dam Spillway</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; font-family: Arial, sans-serif; overflow: hidden; }
#gameCanvas { display: block; width: 100vw; height: 100vh; }
#setupScreen {
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; z-index: 100;
}
#setupScreen h1 { font-size: 2.4rem; color: #f9d342; margin-bottom: 0.3rem; text-shadow: 0 0 20px #f9d342; }
#setupScreen h2 { font-size: 1rem; color: #aaa; margin-bottom: 2rem; }
.setup-form { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 2rem; width: 380px; }
.form-row { margin-bottom: 1.1rem; }
.form-row label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 0.35rem; }
.form-row input, .form-row select {
  width: 100%; padding: 0.5rem 0.75rem; border-radius: 6px;
  border: 1px solid #444; background: #1a1a1a; color: #fff; font-size: 1rem;
}
#playBtn {
  width: 100%; margin-top: 1.2rem; padding: 0.85rem;
  background: #f9d342; color: #111; font-size: 1.2rem; font-weight: bold;
  border: none; border-radius: 8px; cursor: pointer;
}
#playBtn:hover { background: #ffe066; }
#hud { position: fixed; top: 0; left: 0; right: 0; display: none; pointer-events: none; z-index: 10; }
#scoreboard {
  background: rgba(0,0,0,0.75); color: #fff;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.5rem 1.2rem; font-size: 0.9rem; flex-wrap: wrap; gap: 0.5rem;
}
.score-block { display: flex; flex-direction: column; align-items: center; }
.score-block .lbl { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
.score-block .val { font-size: 1.3rem; font-weight: bold; color: #f9d342; }
#bases { display: flex; gap: 6px; align-items: center; }
.bdiamond { width: 14px; height: 14px; background: #444; transform: rotate(45deg); border: 1px solid #666; }
.bdiamond.on { background: #f9d342; }
#flashMsg {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 3rem; font-weight: 900; color: #f9d342;
  text-shadow: 0 0 30px #f9d342, 0 2px 4px #000;
  pointer-events: none; z-index: 20; display: none; text-align: center; white-space: pre-line;
}
#timingBar {
  position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
  width: 340px; display: none; z-index: 15;
}
#timingBar .tblabel { text-align: center; color: #fff; font-size: 0.8rem; margin-bottom: 6px; }
#timingTrack {
  width: 100%; height: 22px; background: #222; border-radius: 11px;
  border: 2px solid #555; position: relative; overflow: hidden;
}
#timingZone { position: absolute; top: 0; height: 100%; background: rgba(249,211,66,0.35); border-radius: 11px; }
#timingCursor { position: absolute; top: 0; height: 100%; width: 6px; background: #fff; border-radius: 3px; box-shadow: 0 0 8px #fff; }
#swingHint { text-align: center; color: #bbb; font-size: 0.75rem; margin-top: 6px; }
#location { position: fixed; bottom: 10px; left: 12px; color: rgba(255,255,255,0.4); font-size: 0.7rem; pointer-events: none; z-index: 5; }
#pitchCount { display: flex; gap: 4px; align-items: center; }
.pdot { width: 10px; height: 10px; border-radius: 50%; background: #444; border: 1px solid #666; }
.pdot.used { background: #e05050; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="setupScreen">
  <h1>YFS Stickball</h1>
  <h2>Sepulveda Dam Spillway, Los Angeles</h2>
  <div class="setup-form">
    <div class="form-row"><label>Home Team Name</label><input id="homeTeam" type="text" value="Homies" maxlength="20"></div>
    <div class="form-row"><label>Away Team Name</label><input id="awayTeam" type="text" value="Visitors" maxlength="20"></div>
    <div class="form-row">
      <label>Players per team (2-6)</label>
      <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option></select>
    </div>
    <div class="form-row">
      <label>Defenders in outfield (3-6)</label>
      <select id="defenderCount"><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option></select>
    </div>
    <button id="playBtn">Play Ball!</button>
  </div>
</div>

<div id="hud">
  <div id="scoreboard">
    <div class="score-block"><span class="lbl" id="awayLbl">Away</span><span class="val" id="awayScore">0</span></div>
    <div class="score-block"><span class="lbl" id="homeLbl">Home</span><span class="val" id="homeScore">0</span></div>
    <div class="score-block"><span class="lbl">Inning</span><span class="val" id="inningVal">1</span></div>
    <div class="score-block"><span class="lbl">Outs</span><span class="val" id="outsVal">0</span></div>
    <div class="score-block">
      <span class="lbl">Pitches</span>
      <div id="pitchCount"><div class="pdot" id="pd0"></div><div class="pdot" id="pd1"></div><div class="pdot" id="pd2"></div></div>
    </div>
    <div class="score-block">
      <span class="lbl">Runners</span>
      <div id="bases"><div class="bdiamond" id="base1"></div><div class="bdiamond" id="base2"></div><div class="bdiamond" id="base3"></div></div>
    </div>
    <div class="score-block"><span class="lbl">Batter</span><span class="val" id="batterName" style="font-size:0.9rem">-</span></div>
  </div>
</div>

<div id="flashMsg"></div>
<div id="timingBar">
  <div class="tblabel">Swing Timing</div>
  <div id="timingTrack"><div id="timingZone"></div><div id="timingCursor"></div></div>
  <div id="swingHint">SPACE or Click to swing</div>
</div>
<div id="location">Sepulveda Dam Spillway, Los Angeles, CA</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ============================================================
// CONSTANTS
// ============================================================
var WALL_DIST  = 200;
var HALF_DIAG  = WALL_DIST / Math.SQRT2; // ~141.4 ft
var POOL_R     = 70;
var PITCH_Z    = 40;
var CAN_Z      = 55;
var CAN_X      = 8;
var WALL_H     = 12;
var WALL_H_LF  = 16;
var PERF_LO    = 0.40, PERF_HI = 0.60;
var GOOD_LO    = 0.28, GOOD_HI = 0.72;
var TIMING_SPD = 1.6;

// ============================================================
// STATE
// ============================================================
var phase = 'setup';
var score = { home:0, away:0 };
var inning = 1, halfInning = 0;
var outs = 0, pitchesUsed = 0;
var ghostRunners = [false,false,false];
var batterIdx = 0;
var teamNames = { home:'Home', away:'Away' };
var playerCount = 4, defenderCount = 4;
var roster = { home:[], away:[] };
var flashTimer = 0;
var timingCur = 0, timingDir = 1, timingActive = false;

// ============================================================
// THREE.JS SETUP
// ============================================================
var canvas = document.getElementById('gameCanvas');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(window.innerWidth, window.innerHeight);

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 350, 700);

var camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
var camPos = new THREE.Vector3(0, 25, -60);
var camTgt = new THREE.Vector3(0, 5, 90);
camera.position.copy(camPos);
camera.lookAt(camTgt);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
var sun = new THREE.DirectionalLight(0xfff4d0, 1.1);
sun.position.set(100, 180, -80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -300;
sun.shadow.camera.right = sun.shadow.camera.top = 300;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 700;
scene.add(sun);

// ============================================================
// FIELD
// ============================================================
function buildField() {
  // Ground
  var gnd = new THREE.Mesh(new THREE.PlaneGeometry(700,700), new THREE.MeshLambertMaterial({color:0x888888}));
  gnd.rotation.x = -Math.PI/2; gnd.receiveShadow = true; scene.add(gnd);

  // Pool (infield) — darker diamond
  var ps = new THREE.Shape();
  ps.moveTo(0, POOL_R); ps.lineTo(POOL_R,0); ps.lineTo(0,-POOL_R); ps.lineTo(-POOL_R,0); ps.closePath();
  var pool = new THREE.Mesh(new THREE.ShapeGeometry(ps), new THREE.MeshLambertMaterial({color:0x777070}));
  pool.rotation.x = -Math.PI/2; pool.position.y = 0.02; scene.add(pool);

  // Pool boundary line
  addDiamondLine(POOL_R, 0x22cc44, 0.05);

  // Pitcher stripe
  var strp = new THREE.Mesh(new THREE.PlaneGeometry(POOL_R*1.42, 2), new THREE.MeshLambertMaterial({color:0xffffff}));
  strp.rotation.x = -Math.PI/2; strp.rotation.z = Math.PI/4;
  strp.position.set(0,0.03,PITCH_Z); scene.add(strp);

  // Home plate
  var hp = new THREE.Mesh(new THREE.PlaneGeometry(3.5,3.5), new THREE.MeshLambertMaterial({color:0xffffff}));
  hp.rotation.x = -Math.PI/2; hp.position.y = 0.04; scene.add(hp);

  // Double-play can
  var can = new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,3.5,16), new THREE.MeshLambertMaterial({color:0xcc3300}));
  can.position.set(CAN_X,1.75,CAN_Z); can.castShadow=true; can.name='dpCan'; scene.add(can);

  // Ghost base pads
  var baseMat = new THREE.MeshLambertMaterial({color:0xeeeeee});
  var bGeo = new THREE.BoxGeometry(3,0.3,3);
  [[HALF_DIAG*0.7, HALF_DIAG*0.7],[0,HALF_DIAG*1.4],[-HALF_DIAG*0.7,HALF_DIAG*0.7]].forEach(function(p){
    var b = new THREE.Mesh(bGeo,baseMat); b.position.set(p[0],0.15,p[1]); scene.add(b);
  });

  // Walls
  buildWalls();

  // Foul lines
  addFoulLine(-1); addFoulLine(1);

  // Background
  buildBackdrop();
}

function addDiamondLine(r, color, y) {
  var pts = [
    new THREE.Vector3(0,y,r), new THREE.Vector3(r,y,0),
    new THREE.Vector3(0,y,-r), new THREE.Vector3(-r,y,0), new THREE.Vector3(0,y,r)
  ];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:color})));
}

function addFoulLine(side) {
  var pts = [new THREE.Vector3(0,0.06,0), new THREE.Vector3(side*HALF_DIAG,0.06,HALF_DIAG)];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:0xffffff})));
}

function buildWalls() {
  var std = new THREE.MeshLambertMaterial({color:0x5a4028});
  var lf  = new THREE.MeshLambertMaterial({color:0x3a2818});
  addWall(0,0, HALF_DIAG,HALF_DIAG, WALL_H, std);
  addWall(HALF_DIAG,HALF_DIAG, 0,HALF_DIAG*2, WALL_H, std);
  addWall(0,HALF_DIAG*2, -HALF_DIAG,HALF_DIAG, WALL_H_LF, lf);
  addWall(-HALF_DIAG,HALF_DIAG, 0,0, WALL_H, std);
}

function addWall(x1,z1,x2,z2,h,mat) {
  var dx=x2-x1, dz=z2-z1, len=Math.sqrt(dx*dx+dz*dz);
  var w = new THREE.Mesh(new THREE.BoxGeometry(len,h,2),mat);
  w.position.set((x1+x2)/2, h/2, (z1+z2)/2);
  w.rotation.y = -Math.atan2(dz,dx);
  w.castShadow=true; w.receiveShadow=true; scene.add(w);
}

function buildBackdrop() {
  var hillMat = new THREE.MeshLambertMaterial({color:0x7a9a6a});
  var dryMat  = new THREE.MeshLambertMaterial({color:0xa09060});
  [
    {r:55,h:80,x:-280,z:350,m:hillMat},{r:40,h:60,x:-180,z:420,m:dryMat},
    {r:65,h:90,x:80,  z:380,m:hillMat},{r:50,h:70,x:250, z:350,m:dryMat},
    {r:45,h:65,x:0,   z:440,m:hillMat},{r:35,h:50,x:-350,z:300,m:dryMat},
    {r:38,h:55,x:360, z:280,m:dryMat}
  ].forEach(function(d){
    var hill = new THREE.Mesh(new THREE.ConeGeometry(d.r,d.h,8),d.m);
    hill.position.set(d.x, d.h/2-2, d.z); scene.add(hill);
  });
  // Dam wall suggestion
  var dam = new THREE.Mesh(new THREE.BoxGeometry(500,30,8), new THREE.MeshLambertMaterial({color:0xaaaaaa}));
  dam.position.set(0,15,480); scene.add(dam);
}

// ============================================================
// CHARACTERS
// ============================================================
function makeHuman(shirtColor) {
  var g = new THREE.Group();
  var skinMat  = new THREE.MeshLambertMaterial({color:0xf5c5a3});
  var shirtMat = new THREE.MeshLambertMaterial({color:shirtColor});
  var legMat   = new THREE.MeshLambertMaterial({color:0x222266});

  function box(w,h,d,mat,px,py,pz){
    var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(px,py,pz); m.castShadow=true; g.add(m); return m;
  }
  function cyl(r,h,mat,px,py,pz,rz){
    var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),mat);
    m.position.set(px,py,pz); if(rz) m.rotation.z=rz; m.castShadow=true; g.add(m); return m;
  }

  box(4,5,2.2,shirtMat, 0,7.5,0);                   // torso
  var head=new THREE.Mesh(new THREE.SphereGeometry(1.6,10,10),skinMat);
  head.position.set(0,11.7,0); head.castShadow=true; g.add(head);
  var lArm=cyl(0.7,4.5,shirtMat,-3.0,5.5,0, 0.3);
  var rArm=cyl(0.7,4.5,shirtMat, 3.0,5.5,0,-0.3);
  cyl(0.8,5,legMat,-1.2,2,0,0);
  cyl(0.8,5,legMat, 1.2,2,0,0);

  g.userData.lArm=lArm; g.userData.rArm=rArm;
  return g;
}

// Game objects
var batterObj, pitcherObj, defObjs=[], ballObj, batMesh, canObj;
var swingProg=0, swingOn=false;
var pitchT=0, pitchOn=false;
var pitchStart=new THREE.Vector3(), pitchEnd=new THREE.Vector3();
var bfOn=false, bfT=0, bfDur=2;
var bfStart=new THREE.Vector3(), bfEnd=new THREE.Vector3();
var bfApex=30, bfGrounder=false, bfHitType='';

function initObjects() {
  // Batter
  batterObj = makeHuman(0xcc2222);
  batterObj.position.set(0,0,0);
  scene.add(batterObj);

  // Bat
  batMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.35,10,8), new THREE.MeshLambertMaterial({color:0x8B4513}));
  batMesh.rotation.z = Math.PI/2;
  batMesh.position.set(6,7.5,0);
  batMesh.castShadow=true;
  batterObj.add(batMesh);

  // Pitcher
  pitcherObj = makeHuman(0x2244aa);
  pitcherObj.position.set(0,0,PITCH_Z);
  pitcherObj.rotation.y = Math.PI;
  scene.add(pitcherObj);

  // Defenders
  var defPos = [
    [0, HALF_DIAG*1.5], [-HALF_DIAG*0.55,HALF_DIAG*1.05], [HALF_DIAG*0.55,HALF_DIAG*1.05],
    [-HALF_DIAG*0.25,HALF_DIAG*1.7], [HALF_DIAG*0.25,HALF_DIAG*1.7], [0,HALF_DIAG*1.15]
  ];
  for(var i=0;i<defenderCount;i++){
    var d = makeHuman(0x2266cc);
    var p = defPos[i%defPos.length];
    var jx=(Math.random()-0.5)*12, jz=(Math.random()-0.5)*12;
    d.position.set(p[0]+jx, 0, p[1]+jz);
    d.userData.home = d.position.clone();
    d.userData.moveTgt = null; d.userData.moving=false;
    scene.add(d); defObjs.push(d);
  }

  // Ball
  ballObj = new THREE.Mesh(new THREE.SphereGeometry(1.3,12,12), new THREE.MeshLambertMaterial({color:0xc8e000}));
  ballObj.castShadow=true; ballObj.visible=false; scene.add(ballObj);

  canObj = scene.getObjectByName('dpCan');
}

// ============================================================
// ROSTER
// ============================================================
function buildRosters() {
  var names=['Alex','Blake','Casey','Dana','Elliott','Flynn','Gray','Harper','Indie','Jamie','Kim','Lee'];
  roster.home = names.slice(0,playerCount).map(function(n,i){return{name:n,idx:i};});
  roster.away = names.slice(6,6+playerCount).map(function(n,i){return{name:n,idx:i};});
  batterIdx=0;
}
function getBatTeam(){return halfInning===0?roster.away:roster.home;}
function curBatter(){return getBatTeam()[batterIdx%getBatTeam().length];}

// ============================================================
// HUD
// ============================================================
function updateHUD() {
  document.getElementById('homeScore').textContent=score.home;
  document.getElementById('awayScore').textContent=score.away;
  document.getElementById('homeLbl').textContent=teamNames.home;
  document.getElementById('awayLbl').textContent=teamNames.away;
  document.getElementById('inningVal').textContent=(halfInning===0?'▲':'▼')+inning;
  document.getElementById('outsVal').textContent=outs;
  document.getElementById('batterName').textContent=curBatter().name;
  for(var i=0;i<3;i++) document.getElementById('pd'+i).className='pdot'+(i<pitchesUsed?' used':'');
  for(var i=0;i<3;i++) document.getElementById('base'+(i+1)).className='bdiamond'+(ghostRunners[i]?' on':'');
}

function showFlash(msg,ms) {
  ms=ms||2200;
  var el=document.getElementById('flashMsg');
  el.textContent=msg; el.style.display='block'; flashTimer=ms;
}
function hideFlash(){document.getElementById('flashMsg').style.display='none';flashTimer=0;}

// ============================================================
// TIMING BAR
// ============================================================
function showTimingBar() {
  timingCur=0; timingDir=1; timingActive=true;
  var zone=document.getElementById('timingZone');
  zone.style.left=(PERF_LO*100)+'%'; zone.style.width=((PERF_HI-PERF_LO)*100)+'%';
  document.getElementById('timingBar').style.display='block';
}
function hideTimingBar(){timingActive=false;document.getElementById('timingBar').style.display='none';}
function updateTimingBar(dt){
  if(!timingActive) return;
  timingCur+=timingDir*TIMING_SPD*dt;
  if(timingCur>=1){timingCur=1;timingDir=-1;}
  if(timingCur<=0){timingCur=0;timingDir=1;}
  document.getElementById('timingCursor').style.left=(timingCur*100)+'%';
}
function evalTiming(){
  if(timingCur>=PERF_LO&&timingCur<=PERF_HI) return 'perfect';
  if(timingCur>=GOOD_LO&&timingCur<=GOOD_HI) return 'good';
  return 'miss';
}

// ============================================================
// SWING
// ============================================================
function startSwing(){swingOn=true;swingProg=0;batMesh.rotation.z=Math.PI/2;batMesh.position.set(6,7.5,0);}
function updateSwing(dt){
  if(!swingOn) return;
  swingProg+=dt*5.5;
  var a=Math.min(swingProg*Math.PI, Math.PI*0.85);
  batMesh.rotation.z=Math.PI/2-a;
  batMesh.position.x=6-Math.sin(a)*3;
  if(swingProg>=0.9){swingOn=false;swingProg=0;batMesh.rotation.z=Math.PI/2;batMesh.position.set(6,7.5,0);}
}

// ============================================================
// PITCH
// ============================================================
function startPitch(){
  if(phase==='game_over') return;
  ballObj.visible=true;
  ballObj.position.set(0,6,PITCH_Z);
  pitchStart.set(0,6,PITCH_Z); pitchEnd.set(0,4,2);
  pitchT=0; pitchOn=true;
  phase='pitching';
  showTimingBar(); updateHUD();
}
function updatePitch(dt){
  if(!pitchOn) return;
  pitchT+=dt/1.3; var t=Math.min(pitchT,1);
  ballObj.position.lerpVectors(pitchStart,pitchEnd,t);
  ballObj.position.y+=Math.sin(t*Math.PI)*3;
  ballObj.rotation.y+=dt*8;
  if(t>=1&&phase==='pitching'){pitchOn=false;handleMiss();}
}

// ============================================================
// SWING INPUT
// ============================================================
function handleSwing(){
  if(phase!=='pitching') return;
  pitchOn=false; hideTimingBar();
  var timing=evalTiming();
  pitchesUsed++; startSwing();

  if(timing==='miss'){
    ballObj.visible=false;
    setTimeout(handleMiss,400); return;
  }

  var r=Math.random(), perfect=(timing==='perfect');
  var ht;
  if(perfect){
    if(r<0.10)       ht='homerun';
    else if(r<0.22)  ht='triple';
    else if(r<0.45)  ht='double';
    else if(r<0.68)  ht='single';
    else if(r<0.80)  ht='grounder';
    else if(r<0.88)  ht='foul';
    else             ht='outfly';
  } else {
    if(r<0.04)       ht='homerun';
    else if(r<0.10)  ht='triple';
    else if(r<0.22)  ht='double';
    else if(r<0.44)  ht='single';
    else if(r<0.60)  ht='grounder';
    else if(r<0.72)  ht='foul';
    else             ht='outfly';
  }
  launchBall(ht);
}

function handleMiss(){
  if(pitchesUsed>=3){recordOut('STRIKEOUT!');}
  else{showFlash('MISS — '+(3-pitchesUsed)+' left',1100);phase='result';setTimeout(function(){if(phase!=='game_over')startPitch();},1800);}
}

// ============================================================
// BALL FLIGHT
// ============================================================
function launchBall(ht){
  var sp=(Math.random()-0.5)*50;
  var ex,ez,apex,gr=false;
  switch(ht){
    case 'homerun': ex=sp*0.4;ez=HALF_DIAG*2+30;apex=90;break;
    case 'triple':  ex=sp;    ez=HALF_DIAG*1.95;apex=60;break;
    case 'double':  ex=sp*1.1;ez=HALF_DIAG*1.55+Math.random()*15;apex=42;break;
    case 'single':  ex=sp*1.4;ez=POOL_R+25+Math.random()*30;apex=28;break;
    case 'grounder':ex=sp*1.2;ez=POOL_R+40+Math.random()*25;apex=4;gr=true;break;
    case 'outfly':  ex=sp;    ez=POOL_R+10+Math.random()*40;apex=24;break;
    case 'foul':    ex=(Math.random()>0.5?1:-1)*(POOL_R*0.3+Math.random()*25);ez=Math.random()*POOL_R*0.8;apex=14;break;
    default:        ex=0;ez=50;apex=20;
  }
  bfStart.set(0,4,2); bfEnd.set(ex,0.8,ez);
  bfApex=apex; bfGrounder=gr; bfHitType=ht;
  bfT=0; bfDur=gr?2.8:2.1; bfOn=true;
  ballObj.visible=true; ballObj.position.copy(bfStart);
  phase='ball_flight';
  sendDefenders(ex,ez);
}

function updateBallFlight(dt){
  if(!bfOn) return;
  bfT+=dt/bfDur; var t=Math.min(bfT,1);
  ballObj.position.lerpVectors(bfStart,bfEnd,t);
  if(!bfGrounder){
    ballObj.position.y+=Math.sin(t*Math.PI)*bfApex;
  } else {
    ballObj.position.y=0.8+Math.max(0,Math.sin(t*Math.PI*3)*(1-t)*6);
  }
  ballObj.rotation.y+=dt*7;
  if(t>=1){bfOn=false;resolveLanding();}
}

function resolveLanding(){
  switch(bfHitType){
    case 'homerun': scorePlay('HOME RUN!',4);break;
    case 'triple':  scorePlay('TRIPLE!',3);break;
    case 'double':  scorePlay('DOUBLE!',2);break;
    case 'single': case 'grounder': scorePlay('SINGLE!',1);break;
    case 'outfly':  recordOut('OUT — Caught!');break;
    case 'foul':
      if(pitchesUsed>=3) recordOut('FOUL — OUT!');
      else{showFlash('FOUL BALL!',1400);phase='result';setTimeout(function(){if(phase!=='game_over')startPitch();},2000);}
      break;
  }
}

// ============================================================
// GAME LOGIC
// ============================================================
function scorePlay(msg,bases){
  var runs=0, nr=[false,false,false];
  for(var i=2;i>=0;i--){
    if(!ghostRunners[i]) continue;
    var dest=i+bases; if(dest>=3) runs++; else nr[dest]=true;
  }
  if(bases>=4) runs++; else nr[bases-1]=true;
  ghostRunners=nr;
  score[halfInning===0?'away':'home']+=runs;
  var rs=runs>0?'\n'+runs+(runs===1?' run':' runs')+' score!':'';
  showFlash(msg+rs,2600);
  phase='result'; updateHUD();
  setTimeout(nextAtBat,3200);
}

function recordOut(msg){
  outs++; showFlash(msg,2000); phase='result'; updateHUD();
  if(outs>=3) setTimeout(endHalfInning,2600);
  else setTimeout(nextAtBat,2600);
}

function nextAtBat(){
  if(phase==='game_over') return;
  pitchesUsed=0; batterIdx++;
  ballObj.visible=false; ballObj.position.set(0,6,PITCH_Z);
  if(canObj){canObj.rotation.x=0;canObj.position.set(CAN_X,1.75,CAN_Z);}
  returnDefenders(); updateHUD(); phase='ready';
  setTimeout(startPitch,1300);
}

function endHalfInning(){
  outs=0;pitchesUsed=0;ghostRunners=[false,false,false];batterIdx=0;
  if(halfInning===0) halfInning=1;
  else{halfInning=0;inning++;if(inning>9){endGame();return;}}
  showFlash((halfInning===0?'▲':'▼')+' Inning '+inning,2200);
  phase='inning_break'; updateHUD(); returnDefenders();
  setTimeout(function(){if(phase!=='game_over'){phase='ready';setTimeout(startPitch,1000);}},3200);
}

function endGame(){
  phase='game_over';
  var msg;
  if(score.home===score.away) msg='TIE GAME!\n'+score.away+' - '+score.home;
  else{
    var w=score.home>score.away?teamNames.home:teamNames.away;
    msg=w+' WINS!\n'+score.away+' - '+score.home;
  }
  document.getElementById('flashMsg').style.fontSize='2.2rem';
  showFlash(msg,999999);
}

// ============================================================
// DEFENDERS
// ============================================================
function sendDefenders(tx,tz){
  defObjs.forEach(function(d,i){
    var sp=(i-defenderCount/2)*14;
    var tgtZ=Math.max(POOL_R+6,tz-8+i*4);
    d.userData.moveTgt=new THREE.Vector3(tx+sp*0.6,0,tgtZ);
    d.userData.moving=true;
  });
}
function returnDefenders(){
  defObjs.forEach(function(d){d.userData.moveTgt=d.userData.home.clone();d.userData.moving=true;});
}
function updateDefenders(dt){
  defObjs.forEach(function(d,i){
    if(!d.userData.moving||!d.userData.moveTgt) return;
    var tgt=d.userData.moveTgt;
    var dx=tgt.x-d.position.x, dz=tgt.z-d.position.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<1.5){d.userData.moving=false;d.position.y=0;return;}
    var spd=28*dt;
    d.position.x+=(dx/dist)*Math.min(spd,dist);
    d.position.z+=(dz/dist)*Math.min(spd,dist);
    d.position.z=Math.max(POOL_R+2,d.position.z);
    d.position.y=Math.abs(Math.sin(Date.now()*0.009+i))*1.0;
    d.rotation.y=Math.atan2(dx,dz);
  });
}

// ============================================================
// CAMERA
// ============================================================
var defCamPos = new THREE.Vector3(0,25,-60);
var defCamTgt = new THREE.Vector3(0,5,90);
function updateCamera(dt){
  var wP,wT;
  if(phase==='ball_flight'&&bfOn){
    var bp=ballObj.position;
    wP=new THREE.Vector3(bp.x*0.3,bp.y+18,bp.z-35);
    wT=bp.clone();
  } else {wP=defCamPos;wT=defCamTgt;}
  camPos.lerp(wP,dt*3.5);
  camTgt.lerp(wT,dt*3.5);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

// ============================================================
// GAME LOOP
// ============================================================
var lastT=0;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);
  var dt=Math.min((ts-lastT)/1000,0.05); lastT=ts;
  if(phase==='setup'){renderer.render(scene,camera);return;}

  updateTimingBar(dt);
  updatePitch(dt);
  updateBallFlight(dt);
  updateSwing(dt);
  updateDefenders(dt);
  updateCamera(dt);

  if(pitcherObj) pitcherObj.position.y=Math.sin(ts*0.0015)*0.25;
  if(flashTimer>0){flashTimer-=dt*1000;if(flashTimer<=0)hideFlash();}

  renderer.render(scene,camera);
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){e.preventDefault();if(phase==='pitching')handleSwing();}
});
canvas.addEventListener('click',function(){if(phase==='pitching')handleSwing();});

// ============================================================
// SETUP SCREEN
// ============================================================
document.getElementById('playBtn').addEventListener('click',function(){
  teamNames.home=document.getElementById('homeTeam').value.trim()||'Home';
  teamNames.away=document.getElementById('awayTeam').value.trim()||'Away';
  playerCount=parseInt(document.getElementById('playerCount').value);
  defenderCount=parseInt(document.getElementById('defenderCount').value);

  document.getElementById('setupScreen').style.display='none';
  document.getElementById('hud').style.display='block';

  buildRosters(); score={home:0,away:0}; inning=1; halfInning=0;
  outs=0; pitchesUsed=0; ghostRunners=[false,false,false]; batterIdx=0;
  updateHUD(); phase='ready';
  setTimeout(startPitch,1500);
});

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ============================================================
// BOOT
// ============================================================
buildField();
initObjects();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
