<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YFS Stickball — Sepulveda Dam Spillway</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
#setup-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
}
#setup-screen h1 { font-size: 2.8em; color: #f5a623; text-shadow: 0 0 24px #f5a623; margin-bottom: 0.15em; }
#setup-screen h2 { font-size: 1em; color: #aaa; margin-bottom: 2em; letter-spacing: 0.05em; }
.setup-form { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 2em; width: 400px; }
.form-group { margin-bottom: 1.2em; }
.form-group label { display: block; margin-bottom: 0.4em; color: #bbb; font-size: 0.88em; text-transform: uppercase; letter-spacing: 0.05em; }
.form-group input, .form-group select { width: 100%; padding: 0.6em 0.9em; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 7px; color: #fff; font-size: 1em; outline: none; }
.form-group select option { background: #1a1a2e; }
.form-row { display: flex; gap: 1em; }
.form-row .form-group { flex: 1; }
#play-btn { width: 100%; padding: 0.85em; background: #f5a623; color: #111; border: none; border-radius: 9px; font-size: 1.25em; font-weight: bold; cursor: pointer; margin-top: 0.5em; }
#play-btn:hover { background: #e09300; }
#hud { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; display: none; }
#scoreboard { background: rgba(0,0,0,0.72); padding: 0.45em 1.1em; display: flex; gap: 1.4em; align-items: center; font-size: 0.88em; border-bottom: 1px solid rgba(255,255,255,0.08); flex-wrap: wrap; }
.score-team { font-size: 1.05em; font-weight: bold; }
.score-val { color: #f5a623; font-size: 1.3em; font-weight: bold; }
.hud-sep { color: #444; font-size: 1.2em; }
.hud-item { display: flex; flex-direction: column; align-items: center; }
.hud-label { font-size: 0.68em; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
#bases-display { display: flex; gap: 5px; align-items: center; margin-top: 2px; }
.base-sq { width: 13px; height: 13px; background: rgba(255,255,255,0.15); border: 1.5px solid #ccc; transform: rotate(45deg); transition: background 0.25s; }
.base-sq.on { background: #f5a623; border-color: #f5a623; }
#timing-wrap { position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); width: 340px; display: none; z-index: 10; text-align: center; }
#timing-label { color: #fff; font-size: 0.82em; margin-bottom: 5px; text-shadow: 0 1px 6px #000; }
#timing-track { height: 24px; background: rgba(0,0,0,0.65); border: 2px solid rgba(255,255,255,0.7); border-radius: 12px; position: relative; overflow: hidden; }
#timing-zone { position: absolute; top: 0; height: 100%; background: rgba(0,220,80,0.45); }
#timing-cursor { position: absolute; top: 0; width: 5px; height: 100%; background: #fff; border-radius: 3px; transform: translateX(-50%); box-shadow: 0 0 10px rgba(255,255,255,0.9); }
#flash-msg { position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%); font-size: 2.6em; font-weight: 900; color: #f5a623; text-shadow: 0 0 30px #f5a623, 0 2px 10px rgba(0,0,0,0.9); z-index: 20; pointer-events: none; opacity: 0; transition: opacity 0.4s; text-align: center; white-space: pre-line; line-height: 1.2; }
#loc-tag { position: fixed; bottom: 12px; right: 14px; font-size: 0.72em; color: rgba(255,255,255,0.35); z-index: 10; pointer-events: none; }
#instructions { position: fixed; bottom: 12px; left: 14px; font-size: 0.72em; color: rgba(255,255,255,0.4); z-index: 10; pointer-events: none; display: none; }
</style>
</head>
<body>
<div id="setup-screen">
  <h1>YFS Stickball</h1>
  <h2>Sepulveda Dam Spillway &middot; Los Angeles</h2>
  <div class="setup-form">
    <div class="form-row">
      <div class="form-group"><label>Home Team</label><input type="text" id="inp-home" value="Homies" maxlength="14"></div>
      <div class="form-group"><label>Away Team</label><input type="text" id="inp-away" value="Visitors" maxlength="14"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Players / Team</label><select id="inp-players"><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option></select></div>
      <div class="form-group"><label>Defenders</label><select id="inp-defenders"><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option></select></div>
    </div>
    <button id="play-btn">Play Ball!</button>
  </div>
</div>
<div id="canvas-container"></div>
<div id="hud">
  <div id="scoreboard">
    <div class="hud-item"><span class="hud-label">Away</span><span id="hud-away-name" class="score-team">Visitors</span></div>
    <span class="score-val" id="hud-away-score">0</span>
    <span class="hud-sep">--</span>
    <span class="score-val" id="hud-home-score">0</span>
    <div class="hud-item"><span class="hud-label">Home</span><span id="hud-home-name" class="score-team">Homies</span></div>
    <div class="hud-item" style="margin-left:0.8em"><span class="hud-label">Inning</span><span id="hud-inning" class="score-val">1</span></div>
    <div class="hud-item"><span class="hud-label">Half</span><span id="hud-half" style="color:#ccc;font-weight:bold">TOP</span></div>
    <div class="hud-item"><span class="hud-label">Outs</span><span id="hud-outs" class="score-val">0</span></div>
    <div class="hud-item"><span class="hud-label">Pitches</span><span id="hud-pitches" style="color:#ccc">0/3</span></div>
    <div class="hud-item"><span class="hud-label">On Base</span><div id="bases-display"><div class="base-sq" id="base-1"></div><div class="base-sq" id="base-2"></div><div class="base-sq" id="base-3"></div></div></div>
    <div class="hud-item"><span class="hud-label">Batting</span><span id="hud-batting" style="color:#ddd;font-size:0.85em">--</span></div>
  </div>
</div>
<div id="timing-wrap">
  <div id="timing-label">SPACE or CLICK to SWING</div>
  <div id="timing-track"><div id="timing-zone"></div><div id="timing-cursor"></div></div>
</div>
<div id="flash-msg"></div>
<div id="loc-tag">Sepulveda Dam Spillway, Los Angeles</div>
<div id="instructions">SPACE / Click = Swing</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
//  YFS STICKBALL  --  Sepulveda Dam Spillway
// ============================================================
var FT = 0.08;
var WALL_FT   = 200 * FT;
var POOL_FT   = 70  * FT;
var PITCH_FT  = 40  * FT;
var CAN_FT    = 55  * FT;
var WALL_H    = 12  * FT;
var TOTAL_INNINGS = 9;

var PHASE = { SETUP:'setup', READY:'ready', PITCHING:'pitching', BALL_FLIGHT:'ball_flight', RESULT:'result', INNING_BREAK:'inning_break', GAME_OVER:'game_over' };

var scene, camera, renderer, clock;
var ballMesh, batterMesh, pitcherMesh, canMesh;
var defenders = [];
var phase = PHASE.SETUP;

var CAM_DEFAULT_POS    = new THREE.Vector3(0, 3.5, 9);
var CAM_DEFAULT_TARGET = new THREE.Vector3(0, 1.5, -6);
var camPos    = CAM_DEFAULT_POS.clone();
var camTarget = CAM_DEFAULT_TARGET.clone();

var tbActive = false, tbPos = 0, tbDir = 1, tbSpeed = 1.4;
var tbSweetL = 0.38, tbSweetR = 0.62;

var G = {};

var pitchT = 0, pitchDur = 1.3;
var pitchFrom = new THREE.Vector3();
var pitchTo   = new THREE.Vector3();

var bfT = 0, bfDur = 2.4;
var bfFrom = new THREE.Vector3();
var bfTo   = new THREE.Vector3();
var bfPeak = 2, bfType = '';

var phaseTimer = 0;
var flashClearId = null;

// ============================================================
//  SETUP
// ============================================================
document.getElementById('play-btn').addEventListener('click', function() {
  var homeTeam    = document.getElementById('inp-home').value.trim() || 'Homies';
  var awayTeam    = document.getElementById('inp-away').value.trim() || 'Visitors';
  var playerCount = parseInt(document.getElementById('inp-players').value);
  var defCount    = parseInt(document.getElementById('inp-defenders').value);

  G = {
    homeTeam: homeTeam, awayTeam: awayTeam,
    playerCount: playerCount, defCount: defCount,
    scores: { home: 0, away: 0 },
    inning: 1, half: 'top',
    outs: 0, pitchCount: 0,
    bases: [false, false, false],
    swingUsed: false, hitType: null
  };

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('instructions').style.display = 'block';
  refreshHUD();
  initThree();
  buildScene();
  phase = PHASE.READY;
  phaseTimer = 0;
  showFlash('Play Ball!', 2200);
  requestAnimationFrame(loop);
});

// ============================================================
//  THREE INIT
// ============================================================
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ab4d4);
  scene.fog = new THREE.FogExp2(0x8ab4d4, 0.018);

  camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 300);
  camera.position.copy(CAM_DEFAULT_POS);
  camera.lookAt(CAM_DEFAULT_TARGET);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  clock = new THREE.Clock();

  var sun = new THREE.DirectionalLight(0xfff4e0, 1.3);
  sun.position.set(12, 22, 10);
  sun.castShadow = true;
  sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 120;
  sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
  sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
  sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048;
  scene.add(sun);
  scene.add(new THREE.AmbientLight(0x7090b8, 0.7));
  scene.add(new THREE.HemisphereLight(0x90b8e0, 0x607850, 0.4));

  window.addEventListener('keydown', function(e) { if (e.code === 'Space') { e.preventDefault(); doSwing(); } });
  renderer.domElement.addEventListener('click', doSwing);
  window.addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

// ============================================================
//  SCENE
// ============================================================
function buildScene() {
  buildField(); buildWalls(); buildMarkings();
  canMesh = buildCan();
  batterMesh  = makeHumanoid(0xffcc88, true);
  batterMesh.position.set(0, 0, 0.3);
  scene.add(batterMesh);
  pitcherMesh = makeHumanoid(0xffcc88, false);
  pitcherMesh.position.set(0, 0, -PITCH_FT);
  pitcherMesh.rotation.y = Math.PI;
  scene.add(pitcherMesh);
  buildDefenders();
  ballMesh = makeBall();
  scene.add(ballMesh);
  resetBall();
  addEnvironment();
}

function buildField() {
  var surf = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x787878 }));
  surf.rotation.x = -Math.PI / 2; surf.receiveShadow = true; scene.add(surf);
  var pSide = POOL_FT * Math.SQRT2;
  var pool = new THREE.Mesh(new THREE.PlaneGeometry(pSide, pSide), new THREE.MeshLambertMaterial({ color: 0x8a8a8a }));
  pool.rotation.x = -Math.PI / 2; pool.rotation.z = Math.PI / 4;
  pool.position.set(0, 0.005, -POOL_FT * 0.5); pool.receiveShadow = true; scene.add(pool);
}

function buildWalls() {
  var wm  = new THREE.MeshLambertMaterial({ color: 0x3a6e24 });
  var wm2 = new THREE.MeshLambertMaterial({ color: 0x4a7a30 });
  var t = 0.25;
  var diag = WALL_FT * Math.SQRT2;

  var lf = new THREE.Mesh(new THREE.BoxGeometry(diag, WALL_H, t), wm);
  lf.position.set(-WALL_FT * 0.5, WALL_H / 2, -WALL_FT);
  lf.rotation.y = Math.PI / 4; lf.castShadow = true; scene.add(lf);

  var rf = new THREE.Mesh(new THREE.BoxGeometry(diag, WALL_H * 0.75, t), wm2);
  rf.position.set(WALL_FT * 0.5, WALL_H * 0.375, -WALL_FT);
  rf.rotation.y = -Math.PI / 4; rf.castShadow = true; scene.add(rf);

  var cf = new THREE.Mesh(new THREE.BoxGeometry(diag, WALL_H * 0.65, t), wm2);
  cf.position.set(0, WALL_H * 0.325, -WALL_FT * 2); cf.castShadow = true; scene.add(cf);
}

function buildMarkings() {
  var wl = new THREE.LineBasicMaterial({ color: 0xffffff });
  var poolBox = new THREE.EdgesGeometry(new THREE.BoxGeometry(POOL_FT * Math.SQRT2, 0.01, POOL_FT * Math.SQRT2));
  var poolLine = new THREE.LineSegments(poolBox, wl);
  poolLine.rotation.y = Math.PI / 4; poolLine.position.set(0, 0.01, -POOL_FT * 0.5); scene.add(poolLine);

  var stripe = new THREE.Mesh(new THREE.PlaneGeometry(POOL_FT * 2.2, 0.12), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  stripe.rotation.x = -Math.PI / 2; stripe.position.set(0, 0.02, -PITCH_FT); scene.add(stripe);

  var plate = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.45), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  plate.rotation.x = -Math.PI / 2; plate.rotation.z = Math.PI / 4; plate.position.set(0, 0.02, 0.25); scene.add(plate);

  [-1, 1].forEach(function(side) {
    var fl = new THREE.Mesh(new THREE.PlaneGeometry(0.07, WALL_FT * Math.SQRT2 * 0.95), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    fl.rotation.x = -Math.PI / 2; fl.rotation.z = side * Math.PI / 4;
    fl.position.set(side * WALL_FT * 0.47, 0.02, -WALL_FT * 0.47); scene.add(fl);
  });
}

function buildCan() {
  var c = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.25, 10), new THREE.MeshLambertMaterial({ color: 0xddbb33 }));
  c.position.set(0.35, 0.125, -CAN_FT); c.castShadow = true; scene.add(c); return c;
}

function addEnvironment() {
  var dam = new THREE.Mesh(new THREE.BoxGeometry(70, 9, 4), new THREE.MeshLambertMaterial({ color: 0xa09880 }));
  dam.position.set(0, 4.5, -52); scene.add(dam);

  for (var i = 0; i < 10; i++) {
    var angle = (i / 10) * Math.PI * 2;
    var r = 28 + Math.random() * 7;
    var tx = Math.cos(angle) * r, tz = -16 + Math.sin(angle) * r * 0.55;
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x5a3a1a }));
    trunk.position.set(tx, 0.7, tz); trunk.castShadow = true; scene.add(trunk);
    var treetop = new THREE.Mesh(new THREE.SphereGeometry(0.85, 7, 5), new THREE.MeshLambertMaterial({ color: 0x2d6a2d }));
    treetop.position.set(tx, 2.1, tz); treetop.castShadow = true; scene.add(treetop);
  }
}

// ============================================================
//  CHARACTERS
// ============================================================
function makeHumanoid(color, hasBat) {
  var g = new THREE.Group();
  var mat = new THREE.MeshLambertMaterial({ color: color });
  function mk(geo) { var m = new THREE.Mesh(geo, mat); m.castShadow = true; return m; }

  var torso = mk(new THREE.BoxGeometry(0.38, 0.56, 0.24)); torso.position.y = 1.08; g.add(torso);
  var head  = mk(new THREE.SphereGeometry(0.17, 8, 6));    head.position.y  = 1.58; g.add(head);

  var aGeo = new THREE.CylinderGeometry(0.065, 0.065, 0.52, 6);
  var lArm = mk(aGeo); lArm.position.set(-0.27, 1.04, 0); lArm.rotation.z =  0.35; g.add(lArm);
  var rArm = mk(aGeo); rArm.position.set( 0.27, 1.04, 0); rArm.rotation.z = -0.35; g.add(rArm);
  g.userData.lArm = lArm; g.userData.rArm = rArm;

  var lGeo = new THREE.CylinderGeometry(0.085, 0.085, 0.62, 6);
  var lLeg = mk(lGeo); lLeg.position.set(-0.13, 0.42, 0); g.add(lLeg);
  var rLeg = mk(lGeo); rLeg.position.set( 0.13, 0.42, 0); g.add(rLeg);
  g.userData.lLeg = lLeg; g.userData.rLeg = rLeg;

  if (hasBat) {
    var batGeo = new THREE.CylinderGeometry(0.018, 0.028, 0.85, 8);
    var batMat = new THREE.MeshLambertMaterial({ color: 0x7a3a10 });
    var bat = new THREE.Mesh(batGeo, batMat); bat.position.y = 0.425; bat.castShadow = true;
    var holder = new THREE.Group(); holder.add(bat);
    holder.position.set(0.32, 1.08, 0.05); holder.rotation.set(-0.25, 0, -0.45);
    g.add(holder); g.userData.batHolder = holder;
  }

  g.userData.animT = 0; g.userData.swingT = -1; g.userData.throwT = -1;
  g.userData.running = false; g.userData.runTarget = null;
  return g;
}

function makeBall() {
  return new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), new THREE.MeshLambertMaterial({ color: 0xbdd626 }));
}

function buildDefenders() {
  defenders.forEach(function(d) { scene.remove(d); });
  defenders = [];
  var n = G.defCount;
  for (var i = 0; i < n; i++) {
    var d = makeHumanoid(0x2244cc, false);
    var hp = defenderHome(i, n);
    d.position.copy(hp);
    d.userData.homePos = hp.clone();
    d.userData.runTarget = hp.clone();
    d.userData.running = false;
    scene.add(d); defenders.push(d);
  }
}

function defenderHome(i, n) {
  var span = Math.PI * 0.85;
  var startA = Math.PI / 2 + (Math.PI - span) / 2;
  var angle = startA + (i / Math.max(n - 1, 1)) * span;
  var r = POOL_FT + (0.35 + 0.55 * (i % 2)) * (WALL_FT - POOL_FT) * 0.75;
  return new THREE.Vector3(Math.cos(angle) * r, 0, -POOL_FT - Math.sin(angle) * r * 0.72);
}

// ============================================================
//  GAME LOOP
// ============================================================
function loop() {
  requestAnimationFrame(loop);
  var dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}

function update(dt) {
  if (phase === PHASE.READY)        updateReady(dt);
  else if (phase === PHASE.PITCHING)     updatePitching(dt);
  else if (phase === PHASE.BALL_FLIGHT)  updateBallFlight(dt);
  else if (phase === PHASE.RESULT)       updateResult(dt);
  else if (phase === PHASE.INNING_BREAK) updateInningBreak(dt);
  animateCharacters(dt);
  lerpCamera(dt);
}

// ============================================================
//  PHASE READY
// ============================================================
function updateReady(dt) {
  phaseTimer += dt;
  if (phaseTimer >= 0.9) beginPitch();
}

function beginPitch() {
  phaseTimer = 0;
  G.swingUsed = false;
  G.pitchCount++;
  document.getElementById('hud-pitches').textContent = G.pitchCount + '/3';

  pitchFrom.set(0, 1.15, -PITCH_FT);
  pitchTo.set(0, 0.65, 0.25);
  pitchT = 0;
  ballMesh.position.copy(pitchFrom);
  pitcherMesh.userData.throwT = 0;

  tbPos = 0; tbDir = 1;
  tbSpeed = 1.1 + Math.random() * 0.9;
  tbSweetL = 0.28 + Math.random() * 0.18;
  tbSweetR = tbSweetL + 0.18 + Math.random() * 0.12;
  document.getElementById('timing-zone').style.left  = (tbSweetL * 100) + '%';
  document.getElementById('timing-zone').style.width = ((tbSweetR - tbSweetL) * 100) + '%';
  document.getElementById('timing-cursor').style.left = '0%';
  document.getElementById('timing-wrap').style.display = 'block';
  tbActive = true;
  phase = PHASE.PITCHING;
}

// ============================================================
//  PHASE PITCHING
// ============================================================
function updatePitching(dt) {
  if (tbActive) {
    tbPos += tbDir * tbSpeed * dt;
    if (tbPos >= 1) { tbPos = 1; tbDir = -1; }
    if (tbPos <= 0) { tbPos = 0; tbDir = 1; }
    document.getElementById('timing-cursor').style.left = (tbPos * 100) + '%';
  }

  pitchT += dt / pitchDur;
  var t = Math.min(pitchT, 1);
  ballMesh.position.lerpVectors(pitchFrom, pitchTo, t);
  ballMesh.position.y += Math.sin(t * Math.PI) * 0.35;

  if (pitchT >= 1 && !G.swingUsed) {
    closeTiming();
    handleMiss();
  }
}

// ============================================================
//  SWING
// ============================================================
function doSwing() {
  if (phase !== PHASE.PITCHING || G.swingUsed) return;
  G.swingUsed = true;
  closeTiming();
  batterMesh.userData.swingT = 0;
  var quality = calcQuality();
  resolveContact(quality);
}

function calcQuality() {
  if (tbPos >= tbSweetL && tbPos <= tbSweetR) {
    var mid = (tbSweetL + tbSweetR) / 2;
    var hw  = (tbSweetR - tbSweetL) / 2;
    return 0.75 + 0.25 * (1 - Math.abs(tbPos - mid) / hw);
  }
  var nearEdge = Math.min(Math.abs(tbPos - tbSweetL), Math.abs(tbPos - tbSweetR));
  return Math.max(0, 0.55 - nearEdge * 3.5);
}

function closeTiming() {
  tbActive = false;
  document.getElementById('timing-wrap').style.display = 'none';
}

// ============================================================
//  HIT RESOLUTION
// ============================================================
function resolveContact(q) {
  if (q < 0.05) { handleMiss(); return; }
  var roll = Math.random();
  var isFly = q > 0.55 ? roll < 0.70 : roll < 0.35;
  var power = q * (0.65 + Math.random() * 0.7);
  var spray = (Math.random() - 0.5) * 1.3;
  var hitType;
  if (isFly) {
    if      (power > 0.90) hitType = 'homerun';
    else if (power > 0.75) hitType = 'triple';
    else if (power > 0.55) hitType = 'double';
    else if (power > 0.28) hitType = 'single_fly';
    else                   hitType = 'foul';
  } else {
    hitType = power > 0.40 ? 'single_ground' : 'foul';
  }
  launchBall(hitType, power, spray);
}

function launchBall(hitType, power, spray) {
  bfType = hitType; bfT = 0;
  bfFrom.copy(ballMesh.position);
  var sx = Math.sin(spray), cz = Math.cos(spray);
  if (hitType === 'foul') {
    bfTo.set((Math.random() - 0.5) * POOL_FT * 1.4, 0, -(Math.random() * POOL_FT * 0.75 + 0.5));
    bfPeak = 1.2; bfDur = 1.1;
  } else if (hitType === 'homerun') {
    bfTo.set(sx * WALL_FT * 0.9, 0, -WALL_FT * 1.55 * cz);
    bfPeak = 5.5; bfDur = 3.2;
  } else if (hitType === 'triple') {
    bfTo.set(sx * WALL_FT * 0.8, 0, -WALL_FT * cz * 1.04);
    bfPeak = 4.2; bfDur = 2.9;
  } else if (hitType === 'double') {
    bfTo.set(sx * WALL_FT * 0.65, 0, -WALL_FT * cz * 0.87);
    bfPeak = 3.5; bfDur = 2.5;
  } else if (hitType === 'single_fly') {
    var r1 = POOL_FT + power * (WALL_FT - POOL_FT) * 0.65;
    bfTo.set(sx * r1, 0, -cz * r1 * 0.9);
    bfPeak = 2.5; bfDur = 2.0;
  } else {
    var r2 = POOL_FT + power * (WALL_FT - POOL_FT) * 0.55;
    bfTo.set(sx * r2 * 0.6, 0, -cz * r2 * 0.85);
    bfPeak = 0.45; bfDur = 1.7;
  }
  sendDefender(bfTo);
  phase = PHASE.BALL_FLIGHT;
}

// ============================================================
//  PHASE BALL FLIGHT
// ============================================================
function updateBallFlight(dt) {
  bfT += dt / bfDur;
  var t = Math.min(bfT, 1);
  ballMesh.position.lerpVectors(bfFrom, bfTo, t);
  ballMesh.position.y += Math.sin(t * Math.PI) * bfPeak;

  var behind = ballMesh.position.clone().add(new THREE.Vector3(0, 2.5, 5.5));
  camPos.lerp(behind, 0.035);
  camTarget.lerp(ballMesh.position, 0.05);

  if (bfT >= 1) onBallLanded();
}

function onBallLanded() {
  phase = PHASE.RESULT; phaseTimer = 0;
  if (bfType === 'foul') { handleFoul(); return; }
  var caught = checkCatch();
  if (caught) { showFlash('CAUGHT -- OUT!', 2800); registerOut(); return; }
  if      (bfType === 'homerun')      { showFlash('HOME RUN!', 3000); advanceRunners(4); }
  else if (bfType === 'triple')       { showFlash('TRIPLE!',   2800); advanceRunners(3); }
  else if (bfType === 'double')       { showFlash('DOUBLE!',   2800); advanceRunners(2); }
  else { showFlash('SINGLE!', 2500); advanceRunners(1); }
  refreshHUD();
}

function handleFoul() {
  if (G.pitchCount >= 3) { showFlash('FOUL -- OUT!', 2500); registerOut(); }
  else { showFlash('FOUL BALL!', 1800); }
}

function checkCatch() {
  if (bfType === 'single_ground') return false;
  var minD = Infinity;
  defenders.forEach(function(d) {
    var dx = d.position.x - bfTo.x, dz = d.position.z - bfTo.z;
    minD = Math.min(minD, Math.sqrt(dx*dx + dz*dz));
  });
  if (minD < 1.2) return Math.random() < 0.90;
  if (minD < 2.8) return Math.random() < 0.50;
  if (minD < 5.0) return Math.random() < 0.18;
  return false;
}

// ============================================================
//  PHASE RESULT
// ============================================================
function updateResult(dt) {
  phaseTimer += dt;
  var wait = (bfType === 'homerun' || bfType === 'triple') ? 3.2 : 2.2;
  if (phaseTimer < wait) return;
  camPos.copy(CAM_DEFAULT_POS); camTarget.copy(CAM_DEFAULT_TARGET);
  if (G.outs >= 3) return;
  if (G.pitchCount >= 3) { G.pitchCount = 0; resetDefenders(); }
  resetBall();
  phase = PHASE.READY; phaseTimer = 0;
  refreshHUD();
}

// ============================================================
//  PHASE INNING BREAK
// ============================================================
function updateInningBreak(dt) {
  phaseTimer += dt;
  if (phaseTimer >= 3.5) {
    phaseTimer = 0; G.pitchCount = 0;
    resetBall(); resetDefenders(); refreshHUD();
    phase = PHASE.READY;
  }
}

// ============================================================
//  GAME LOGIC
// ============================================================
function handleMiss() {
  if (G.pitchCount >= 3) { showFlash('STRIKE THREE -- OUT!', 2600); registerOut(); }
  else { showFlash('MISS...', 1400); phase = PHASE.RESULT; phaseTimer = 0; bfType = 'miss'; }
}

function registerOut() {
  G.outs++; refreshHUD();
  if (G.outs >= 3) endHalf();
  else { G.pitchCount = 0; phase = PHASE.RESULT; phaseTimer = 0; }
}

function advanceRunners(bases) {
  var runs = 0;
  var nb = [false, false, false];
  for (var i = 2; i >= 0; i--) {
    if (!G.bases[i]) continue;
    var dest = i + bases;
    if (dest >= 3) runs++;
    else nb[dest] = true;
  }
  var bd = bases - 1;
  if (bd >= 3) runs++;
  else if (bd >= 0) nb[bd] = true;
  G.bases = nb;
  var key = G.half === 'top' ? 'away' : 'home';
  G.scores[key] += runs;
  if (runs > 0) { setTimeout(function() { showFlash('+' + runs + ' Run' + (runs > 1 ? 's' : '') + '!', 1600); }, 300); }
}

function endHalf() {
  G.outs = 0; G.bases = [false, false, false]; G.pitchCount = 0;
  canMesh.position.set(0.35, 0.125, -CAN_FT); canMesh.rotation.set(0, 0, 0);
  if (G.half === 'top') {
    G.half = 'bottom'; showFlash('BOT ' + G.inning, 2500);
  } else {
    G.half = 'top'; G.inning++;
    if (G.inning > TOTAL_INNINGS) { gameOver(); return; }
    showFlash('TOP ' + G.inning, 2500);
  }
  refreshHUD(); phase = PHASE.INNING_BREAK; phaseTimer = 0;
}

function gameOver() {
  var s = G.scores, ht = G.homeTeam, at = G.awayTeam;
  var winner = s.home > s.away ? ht : s.away > s.home ? at : 'TIE';
  var msg = 'GAME OVER\n' + (winner === 'TIE' ? 'Tie Game!' : winner + ' Win!') + '\n' + at + ' ' + s.away + ' -- ' + s.home + ' ' + ht;
  showFlash(msg, 99999);
  phase = PHASE.GAME_OVER; refreshHUD();
}

// ============================================================
//  DEFENDER AI
// ============================================================
function sendDefender(target) {
  var best = null, bestDist = Infinity;
  defenders.forEach(function(d) {
    var dist = d.position.distanceTo(target);
    if (dist < bestDist) { bestDist = dist; best = d; }
  });
  if (best) { best.userData.runTarget = target.clone(); best.userData.running = true; }
}

function resetDefenders() {
  defenders.forEach(function(d, i) {
    d.userData.runTarget = defenderHome(i, defenders.length).clone();
    d.userData.running = true;
  });
}

// ============================================================
//  ANIMATION
// ============================================================
function animateCharacters(dt) {
  // Batter swing
  var bh = batterMesh.userData.batHolder;
  if (batterMesh.userData.swingT >= 0) {
    batterMesh.userData.swingT += dt * 5;
    var st = batterMesh.userData.swingT;
    if (bh) {
      var arc = Math.sin(Math.min(st, Math.PI));
      bh.rotation.y = -arc * 2.0;
      bh.rotation.z = -0.45 - arc * 0.6;
    }
    if (st > Math.PI) batterMesh.userData.swingT = -1;
  }

  // Pitcher throw
  if (pitcherMesh.userData.throwT >= 0) {
    pitcherMesh.userData.throwT += dt * 3;
    var pt = Math.min(pitcherMesh.userData.throwT, Math.PI);
    if (pitcherMesh.userData.rArm) pitcherMesh.userData.rArm.rotation.x = -Math.sin(pt) * 1.9;
    if (pt >= Math.PI) pitcherMesh.userData.throwT = -1;
  }

  // Defenders
  defenders.forEach(function(d) {
    if (!d.userData.running || !d.userData.runTarget) return;
    var target = d.userData.runTarget;
    var dx = target.x - d.position.x, dz = target.z - d.position.z;
    var dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < 0.12) {
      d.userData.running = false;
      if (d.userData.lLeg) { d.userData.lLeg.rotation.x = 0; d.userData.rLeg.rotation.x = 0; }
      return;
    }
    var step = Math.min(dist, 3.8 * dt);
    d.position.x += (dx / dist) * step;
    d.position.z += (dz / dist) * step;
    d.rotation.y = Math.atan2(dx, dz);
    d.userData.animT = (d.userData.animT || 0) + dt * 9;
    var sw = Math.sin(d.userData.animT) * 0.55;
    if (d.userData.lLeg) d.userData.lLeg.rotation.x =  sw;
    if (d.userData.rLeg) d.userData.rLeg.rotation.x = -sw;
    if (d.userData.lArm) d.userData.lArm.rotation.x = -sw * 0.6;
    if (d.userData.rArm) d.userData.rArm.rotation.x =  sw * 0.6;
  });
}

// ============================================================
//  CAMERA
// ============================================================
function lerpCamera(dt) {
  if (phase !== PHASE.BALL_FLIGHT) {
    camPos.lerp(CAM_DEFAULT_POS, dt * 2.8);
    camTarget.lerp(CAM_DEFAULT_TARGET, dt * 2.8);
  }
  camera.position.copy(camPos);
  camera.lookAt(camTarget);
}

// ============================================================
//  HELPERS
// ============================================================
function resetBall() { ballMesh.position.set(0, 1.15, -PITCH_FT); }

function refreshHUD() {
  document.getElementById('hud-home-score').textContent = G.scores.home;
  document.getElementById('hud-away-score').textContent = G.scores.away;
  document.getElementById('hud-home-name').textContent  = G.homeTeam;
  document.getElementById('hud-away-name').textContent  = G.awayTeam;
  document.getElementById('hud-inning').textContent     = G.inning;
  document.getElementById('hud-half').textContent       = G.half === 'top' ? 'TOP' : 'BOT';
  document.getElementById('hud-outs').textContent       = G.outs;
  document.getElementById('hud-pitches').textContent    = G.pitchCount + '/3';
  document.getElementById('hud-batting').textContent    = G.half === 'top' ? G.awayTeam : G.homeTeam;
  ['base-1','base-2','base-3'].forEach(function(id, i) {
    var el = document.getElementById(id);
    if (G.bases[i]) el.classList.add('on'); else el.classList.remove('on');
  });
}

function showFlash(msg, ms) {
  var el = document.getElementById('flash-msg');
  el.innerHTML = msg.replace(/\n/g, '<br>');
  el.style.opacity = '1';
  if (flashClearId) clearTimeout(flashClearId);
  flashClearId = setTimeout(function() { el.style.opacity = '0'; }, ms);
}
</script>
